name: Diagnosi (temporanea)
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Raggiungibilità di cgsse.it dai server di GitHub
        run: |
          echo "IP in uscita:"; curl -sS -m 15 https://api.ipify.org || true; echo
          for ua in "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36" "Infotreno-scioperi/1.0"; do
            echo "--- UA: $ua"
            curl -sS -m 25 -o /dev/null -w "http=%{http_code} connect=%{time_connect}s totale=%{time_total}s\n" -A "$ua" https://cgsse.it/robots.txt || echo "errore curl: $?"
          done
          echo "--- solo connessione TCP/TLS"
          curl -sS -m 25 -o /dev/null -w "connect=%{time_connect}s tls=%{time_appconnect}s\n" https://cgsse.it/ || echo "errore curl: $?"
