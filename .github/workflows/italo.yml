name: Orari Italo

# Ogni ora (dalle 5 alle 23 ora italiana circa) guarda i treni Italo in circolazione e aggiorna italo-orari.json,
# l'archivio degli orari che l'app usa per mostrare le fermate dei treni non ancora partiti.
on:
  schedule:
    - cron: '7 4-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: italo-orari
  cancel-in-progress: false

jobs:
  orari:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Legge i treni Italo
        run: python italo_orari.py italo-orari.json
      - name: Pubblica se è cambiato qualcosa
        run: |
          git config user.name "infotreno-bot"
          git config user.email "infotreno-bot@users.noreply.github.com"
          git add italo-orari.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Orari Italo $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
