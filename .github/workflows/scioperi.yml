name: Aggiorna scioperi

# Due volte al giorno legge il calendario pubblico della Commissione di Garanzia Sciopero e aggiorna scioperi.json.
# Repository pubblico: i minuti delle azioni sono gratuiti.
on:
  schedule:
    - cron: "17 5,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scioperi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Legge il calendario
        run: python3 scioperi_cgsse.py scioperi.json 90

      - name: Salva se è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scioperi.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Scioperi: aggiornamento $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
